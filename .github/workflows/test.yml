name: Test suite

# Pull-request only. This workflow never writes to any database or host;
# every job runs against a throwaway MongoDB (in-memory or a service
# container) and stubs the one external API. The production ETL cron lives
# in etl.yml and is untouched by this file.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest + React Testing Library)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Backend (Vitest + supertest + mongodb-memory-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep the downloaded mongod binary outside node_modules so it survives
      # `npm ci` and can be cached between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-etl
          path: etl/coverage.xml
          if-no-files-found: ignore
