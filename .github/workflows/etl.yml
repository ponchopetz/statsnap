name: ETL daily load

# Daily, not weekly: nflverse republishes weekly player stats after every game
# window, and each run reloads the whole season, so a game's stats show up by
# the next morning. 10:17 UTC lands after nflverse's overnight updates, with
# room for GitHub starting scheduled runs a few hours late.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC every day
  workflow_dispatch:          # manual run button in the Actions tab

# Hand-maintained, one edit per year. Set this to the season you want loaded.
# Bump it to the new year in early September, once that season's Week 1 has
# actually been played (so nflverse has regular-season rows to pull). Same
# per-season-config pattern as the schedule week-boundary anchors in the
# backend; verify against the official schedule each year.
env:
  SEASON: "2026"

jobs:
  load:
    # Pinned, not ubuntu-latest: that label moves to each new Ubuntu LTS on
    # GitHub's schedule. See "CI runner images" in docs/adr/DECISIONS.md.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the loader
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python load.py
